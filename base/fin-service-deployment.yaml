apiVersion: apps/v1
kind: Deployment
metadata:
  name: fintech-engine
  namespace: production-apps
  labels:
    app.kubernetes.io/name: fintech-engine
    app.kubernetes.io/part-of: fintech-platform
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: fintech-engine
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fintech-engine
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fintech-engine
          image: ghcr.io/felipemadson/spring-boot-fintech-transaction-engine:1.0.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
